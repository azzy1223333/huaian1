<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="空院子里的折叠椅">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aaa794"/><stop offset=".6" stop-color="#888675"/><stop offset="1" stop-color="#5d5c50"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#716e5d"/><stop offset="1" stop-color="#444337"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".72">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="3" seed="71" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- 背景楼 -->
  <rect x="0" y="60" width="800" height="330" fill="#777466" opacity=".72"/>
  <g fill="#5b594e">
    <rect x="50" y="115" width="42" height="48"/><rect x="112" y="115" width="42" height="48"/><rect x="174" y="115" width="42" height="48"/>
    <rect x="236" y="115" width="42" height="48"/><rect x="298" y="115" width="42" height="48"/><rect x="360" y="115" width="42" height="48"/>
    <rect x="422" y="115" width="42" height="48"/><rect x="484" y="115" width="42" height="48"/><rect x="546" y="115" width="42" height="48"/>
    <rect x="608" y="115" width="42" height="48"/><rect x="670" y="115" width="42" height="48"/><rect x="732" y="115" width="42" height="48"/>
    <rect x="50" y="202" width="42" height="48"/><rect x="112" y="202" width="42" height="48"/><rect x="174" y="202" width="42" height="48"/>
    <rect x="236" y="202" width="42" height="48"/><rect x="298" y="202" width="42" height="48"/><rect x="360" y="202" width="42" height="48"/>
    <rect x="422" y="202" width="42" height="48"/><rect x="484" y="202" width="42" height="48"/><rect x="546" y="202" width="42" height="48"/>
    <rect x="608" y="202" width="42" height="48"/><rect x="670" y="202" width="42" height="48"/><rect x="732" y="202" width="42" height="48"/>
  </g>
  <!-- 红横幅 -->
  <rect x="110" y="62" width="580" height="31" fill="#6e1c1a" opacity=".8"/>
  <text x="400" y="83" text-anchor="middle" font-family="SimSun, serif" font-size="15" fill="#d7bd8e" letter-spacing="5">热烈祝贺槐安里被评为文明小区</text>
  <!-- 地面 -->
  <rect y="389" width="800" height="211" fill="url(#ground)"/>
  <path d="M0 438 L800 424 M0 510 L800 498 M0 562 L800 554" stroke="#5a584b" stroke-width="1" opacity=".5"/>
  <!-- 槐树 -->
  <g stroke="#383b31" fill="none" stroke-linecap="round" opacity=".85">
    <path d="M75 560 Q65 460 87 360 Q99 300 78 244" stroke-width="15"/>
    <path d="M90 378 Q40 340 24 292 M86 336 Q127 300 160 302 M78 405 Q123 383 156 404" stroke-width="5"/>
  </g>
  <!-- 折叠椅 -->
  <g transform="translate(390 355)">
    <path d="M-40 0 L-21 96 M42 0 L21 96 M-32 14 L34 14" stroke="#3d3a31" stroke-width="4"/>
    <path d="M-36 28 L-46 110 M38 28 L48 110 M-42 110 L-25 110 M30 110 L47 110" stroke="#4a4639" stroke-width="3"/>
    <rect x="-34" y="20" width="68" height="25" fill="#5b5040"/>
    <rect x="-36" y="-30" width="72" height="54" fill="#6a5c47"/>
    <path d="M-32 20 L32 20 M-32 -8 L32 -8 M-32 -24 L32 -24" stroke="#3d352a" stroke-width="2"/>
    <!-- 红纸人 -->
    <g transform="translate(0 -28)">
      <circle cx="0" cy="-13" r="9" fill="#8d2320"/>
      <path d="M-11 16 Q0 -8 11 16 L7 36 L-7 36 Z" fill="#9a2824"/>
      <path d="M-6 -18 L-14 -28 M6 -18 L14 -28" stroke="#8d2320" stroke-width="2"/>
      <path d="M0 36 L-5 52 M0 36 L5 52" stroke="#8d2320" stroke-width="2"/>
    </g>
  </g>
  <!-- 地上的纸钱 -->
  <g fill="#c5b992" opacity=".7">
    <path d="M274 500 L288 492 L303 503 L289 512 Z"/>
    <path d="M549 520 L563 512 L577 521 L563 532 Z"/>
    <path d="M604 488 L614 482 L625 491 L615 498 Z"/>
    <path d="M226 548 L240 540 L254 551 L239 558 Z"/>
  </g>
  <!-- 空中的灰 -->
  <g fill="#c9c2ab" opacity=".4" filter="url(#soft)">
    <circle cx="220" cy="250" r="2"/><circle cx="330" cy="318" r="1.5"/><circle cx="520" cy="230" r="1.6"/>
    <circle cx="600" cy="340" r="2"/><circle cx="460" cy="280" r="1.2"/><circle cx="180" cy="350" r="1.4"/>
  </g>
  <rect width="800" height="600" filter="url(#noise)" opacity=".3" style="mix-blend-mode:multiply"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <text x="42" y="570" font-family="Courier New, monospace" font-size="11" fill="#b1aa93" opacity=".5">IMGP_0099</text>
</svg>
