<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="七号楼走廊">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151813"/><stop offset="1" stop-color="#555b4c"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#151813"/><stop offset="1" stop-color="#484f42"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e4439"/><stop offset="1" stop-color="#191c17"/>
    </linearGradient>
    <radialGradient id="bulb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1e9c4" stop-opacity=".9"/><stop offset=".2" stop-color="#c8c49b" stop-opacity=".4"/><stop offset="1" stop-color="#c8c49b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dark" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#020302"/><stop offset=".7" stop-color="#050705"/><stop offset="1" stop-color="#11140f"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".7">
      <stop offset=".42" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="33" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect width="800" height="600" fill="#080a08"/>
  <!-- 透视墙 -->
  <path d="M0 0 L340 238 L340 430 L0 600 Z" fill="url(#wallL)"/>
  <path d="M800 0 L460 238 L460 430 L800 600 Z" fill="url(#wallR)"/>
  <path d="M340 238 L460 238 L460 430 L340 430 Z" fill="url(#dark)"/>
  <path d="M0 600 L340 430 L460 430 L800 600 Z" fill="url(#floor)"/>
  <path d="M0 0 L800 0 L460 238 L340 238 Z" fill="#3a4036"/>
  <!-- 天花灯 -->
  <g>
    <circle cx="396" cy="206" r="70" fill="url(#bulb)" filter="url(#glow)"/>
    <rect x="392" y="120" width="5" height="55" fill="#5e6252"/>
    <circle cx="394" cy="183" r="6" fill="#ede4bd"/>
    <circle cx="394" cy="183" r="28" fill="url(#bulb)" opacity=".6"/>
  </g>
  <!-- 左右门 -->
  <g fill="#2a3027" stroke="#565c4a" stroke-width="2">
    <path d="M98 186 L198 218 L198 430 L98 478 Z"/>
    <path d="M221 224 L292 245 L292 420 L221 442 Z"/>
    <path d="M603 186 L703 152 L703 478 L603 430 Z"/>
    <path d="M509 224 L580 245 L580 420 L509 442 Z"/>
  </g>
  <!-- 红色的门 -->
  <path d="M603 186 L703 152 L703 478 L603 430 Z" fill="#5e1a17"/>
  <path d="M616 197 L690 172 L690 460 L616 420 Z" fill="none" stroke="#8c3a30" stroke-width="1.5"/>
  <text x="650" y="328" text-anchor="middle" transform="rotate(-6 650 328)" font-family="SimSun, serif" font-size="26" fill="#c09a68" opacity=".75">404</text>
  <!-- 地面砖缝 -->
  <g stroke="#5c6253" opacity=".28">
    <path d="M0 600 L340 430 M800 600 L460 430"/>
    <path d="M170 600 L355 430 M340 600 L400 430 M630 600 L445 430 M470 600 L405 430"/>
    <path d="M0 548 L800 548 M0 508 L800 508 M120 466 L680 466"/>
  </g>
  <!-- 远处小小的人影 -->
  <g opacity=".72" filter="url(#soft)">
    <circle cx="401" cy="300" r="7" fill="#c9c7b4"/>
    <path d="M391 310 Q401 303 411 310 L415 366 L387 366 Z" fill="#c9c7b4"/>
    <path d="M388 330 L378 360 M414 330 L424 360" stroke="#c9c7b4" stroke-width="3"/>
  </g>
  <!-- 墙上字 -->
  <g transform="rotate(-4 186 357)" fill="#6f6a55" font-family="SimSun, serif" font-size="15" opacity=".5">
    <text x="134" y="350">不要回头</text>
    <text x="140" y="373" font-size="9">NO LOOKING BACK</text>
  </g>
  <!-- 尘埃 -->
  <g fill="#d9d4b9" opacity=".33">
    <circle cx="280" cy="250" r="1"/><circle cx="342" cy="196" r="1.2"/><circle cx="440" cy="282" r=".8"/>
    <circle cx="502" cy="326" r="1"/><circle cx="366" cy="380" r="1.3"/><circle cx="540" cy="250" r=".9"/>
    <circle cx="240" cy="330" r="1"/><circle cx="470" cy="400" r=".8"/>
  </g>
  <rect width="800" height="600" filter="url(#noise)" opacity=".31" style="mix-blend-mode:multiply"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <text x="36" y="566" font-family="Courier New, monospace" font-size="12" fill="#8e937c" opacity=".5">07-04F  CAM 02</text>
</svg>
