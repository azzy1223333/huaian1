<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="地下室火灾后的墙壁">
  <defs>
    <radialGradient id="fire" cx=".52" cy=".62" r=".46">
      <stop offset="0" stop-color="#f5d18a" stop-opacity=".9"/><stop offset=".25" stop-color="#ce7c2d" stop-opacity=".65"/><stop offset=".6" stop-color="#6b2411" stop-opacity=".32"/><stop offset="1" stop-color="#0a0806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1510"/><stop offset=".6" stop-color="#0c0806"/><stop offset="1" stop-color="#030202"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4138" stop-opacity=".1"/><stop offset="1" stop-color="#17120f" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".7">
      <stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="88" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- 墙 -->
  <rect x="0" y="0" width="800" height="470" fill="#2b241c"/>
  <g fill="#1d1914">
    <rect x="35" y="76" width="150" height="240"/><rect x="615" y="58" width="150" height="260"/>
  </g>
  <!-- 烧黑的门框 -->
  <path d="M265 118 L535 118 L535 500 L265 500 Z" fill="#080604"/>
  <path d="M282 134 L518 134 L518 500 L282 500 Z" fill="#000"/>
  <!-- 火光 -->
  <ellipse cx="400" cy="420" rx="260" ry="220" fill="url(#fire)" filter="url(#blur)"/>
  <g filter="url(#blur2)" opacity=".78">
    <path d="M360 500 Q335 430 370 380 Q382 430 395 360 Q430 430 421 470 Q455 438 444 500 Z" fill="#c57935" opacity=".5"/>
    <path d="M341 500 Q327 458 345 420 Q360 460 370 500 Z" fill="#e0a54b" opacity=".35"/>
  </g>
  <!-- 门内燃烧的轮廓 -->
  <g opacity=".6" filter="url(#blur2)">
    <circle cx="405" cy="338" r="18" fill="#090705"/>
    <path d="M367 360 Q405 338 443 360 L450 470 L360 470 Z" fill="#090705"/>
    <path d="M360 398 Q330 440 337 466 M450 398 Q480 440 473 466" stroke="#090705" stroke-width="11" fill="none"/>
  </g>
  <!-- 墙上的手印 -->
  <g fill="#1b120d" opacity=".8">
    <ellipse cx="214" cy="270" rx="13" ry="19" transform="rotate(-12 214 270)"/>
    <ellipse cx="184" cy="251" rx="4.5" ry="13" transform="rotate(-30 184 251)"/>
    <ellipse cx="198" cy="243" rx="4.5" ry="14" transform="rotate(-20 198 243)"/>
    <ellipse cx="213" cy="239" rx="4.5" ry="14" transform="rotate(-8 213 239)"/>
    <ellipse cx="228" cy="244" rx="4.5" ry="13" transform="rotate(8 228 244)"/>
    <ellipse cx="239" cy="257" rx="4.5" ry="11" transform="rotate(24 239 257)"/>
  </g>
  <g fill="#1a120c" opacity=".55">
    <ellipse cx="582" cy="330" rx="11" ry="17" transform="rotate(16 582 330)"/>
    <ellipse cx="602" cy="316" rx="4" ry="11" transform="rotate(36 602 316)"/>
    <ellipse cx="590" cy="305" rx="4" ry="12" transform="rotate(24 590 305)"/>
    <ellipse cx="576" cy="306" rx="4" ry="12" transform="rotate(10 576 306)"/>
    <ellipse cx="563" cy="314" rx="4" ry="11" transform="rotate(-8 563 314)"/>
  </g>
  <!-- 地上烧剩的门牌 -->
  <g transform="translate(500 524) rotate(-9)">
    <rect x="-55" y="-25" width="110" height="50" fill="#3b2d20" stroke="#1a120b" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="Courier New, monospace" font-size="27" fill="#9b7145" opacity=".8">404</text>
  </g>
  <!-- 烟 -->
  <path d="M220 0 Q270 140 330 210 Q390 280 420 0 Z" fill="url(#smoke)" opacity=".7"/>
  <path d="M520 0 Q490 150 540 270 Q600 380 650 0 Z" fill="url(#smoke)" opacity=".5"/>
  <!-- 白点灰烬 -->
  <g fill="#e0c8a1" opacity=".35">
    <circle cx="330" cy="300" r="1.5"/><circle cx="480" cy="260" r="1"/><circle cx="540" cy="420" r="1.8"/>
    <circle cx="300" cy="450" r="1.2"/><circle cx="620" cy="310" r="1"/><circle cx="260" cy="180" r="1.4"/>
  </g>
  <rect width="800" height="600" filter="url(#noise)" opacity=".36" style="mix-blend-mode:multiply"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <text x="42" y="570" font-family="Courier New, monospace" font-size="11" fill="#a98660" opacity=".45">2000-01-01  00:47</text>
</svg>
