    <rect x="45" y="18" width="12" height="9" fill="#0a0a08"/>
    <rect x="66" y="18" width="12" height="9" fill="#0a0a08"/>
    <rect x="24" y="213" width="12" height="9" fill="#0a0a08"/>
    <rect x="45" y="213" width="12" height="9" fill="#0a0a08"/>
