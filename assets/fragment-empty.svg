    <path d="M286 22 L281 210"/>
    <path d="M42 202 L107 188" stroke-width="2"/>
    <path d="M211 48 L272 41"/>
  </g>
  <g fill="#c7b489" opacity=".1">
    <circle cx="71" cy="67" r="2"/><circle cx="249" cy="93" r="1.5"/>
    <circle cx="177" cy="183" r="1.8"/><circle cx="109" cy="150" r="1"/>
    <circle cx="214" cy="202" r="1.2"/><circle cx="48" cy="126" r="1.3"/>
  </g>
