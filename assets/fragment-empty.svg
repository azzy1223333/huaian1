<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="未显影的底片">
  <defs>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2b26"/>
      <stop offset=".45" stop-color="#11120f"/>
      <stop offset="1" stop-color="#24231e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".45" cy=".4" r=".55">
      <stop offset="0" stop-color="#b5965d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b5965d" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="44" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
