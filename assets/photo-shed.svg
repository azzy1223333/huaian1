  <rect y="460" width="800" height="140" fill="#aab1a7" opacity=".055"/>
  <rect width="800" height="600" filter="url(#noise)" opacity=".32" style="mix-blend-mode:multiply"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <text x="42" y="570" font-family="Courier New, monospace" font-size="11" fill="#9d9a86" opacity=".48">DSC_0404  -  23:58</text>
