        <text x="408" y="386" text-anchor="middle" font-family="SimSun, serif" font-size="12" fill="#671313">封 · 禁止入内</text>
      </g>
    </g>
    <!-- 单车 -->
    <g stroke="#111410" fill="none" stroke-width="4">
      <circle cx="184" cy="478" r="31"/><circle cx="282" cy="478" r="31"/>
      <path d="M184 478 L216 420 L260 420 L282 478 M216 420 L238 478 L184 478 M229 412 L242 396 M256 415 L268 391"/>
      <path d="M239 420 L242 396 L264 390" stroke-width="2"/>
      <circle cx="528" cy="487" r="29"/><circle cx="617" cy="487" r="29"/>
      <path d="M528 487 L558 432 L596 432 L617 487 M558 432 L577 487 L528 487 M568 424 L580 407 M593 427 L603 404"/>
      <path d="M577 432 L580 407 L599 402" stroke-width="2"/>
    </g>
    <!-- 车棚里的黑暗 -->
    <rect x="585" y="351" width="115" height="173" fill="#090b09" opacity=".75"/>
    <g opacity=".4" filter="url(#blur)">
      <circle cx="643" cy="404" r="7" fill="#b3b09b"/>
      <path d="M633 415 Q643 407 653 415 L656 464 L630 464 Z" fill="#b3b09b"/>
