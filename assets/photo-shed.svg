<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="七号楼后的自行车棚">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343c42"/><stop offset=".55" stop-color="#242b2e"/><stop offset="1" stop-color="#15191a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e5b46"/><stop offset=".45" stop-color="#4f4133"/><stop offset="1" stop-color="#30271e"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222522"/><stop offset="1" stop-color="#060706"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d6a14d" stop-opacity=".35"/><stop offset="1" stop-color="#d6a14d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".7">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="55" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#night)"/>
  <!-- 背景楼 -->
  <g opacity=".48">
