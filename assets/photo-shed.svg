    <g stroke="#2b231b" stroke-width="2" opacity=".7">
      <path d="M137 203 L110 275"/><path d="M178 201 L153 273"/><path d="M219 199 L196 271"/><path d="M260 197 L239 269"/>
      <path d="M301 195 L282 267"/><path d="M342 193 L325 265"/><path d="M383 191 L368 263"/><path d="M424 189 L411 261"/>
      <path d="M465 187 L454 259"/><path d="M506 185 L497 257"/><path d="M547 183 L540 255"/><path d="M588 181 L583 253"/>
      <path d="M629 179 L626 251"/><path d="M670 177 L669 249"/>
