      <rect x="25" y="174" width="42" height="48"/><rect x="88" y="174" width="42" height="48"/><rect x="151" y="174" width="42" height="48"/>
      <rect x="25" y="258" width="42" height="48"/><rect x="88" y="258" width="42" height="48"/><rect x="151" y="258" width="42" height="48"/>
      <rect x="650" y="76" width="40" height="46"/><rect x="710" y="76" width="40" height="46"/>
      <rect x="650" y="160" width="40" height="46"/><rect x="710" y="160" width="40" height="46"/>
      <rect x="650" y="244" width="40" height="46"/><rect x="710" y="244" width="40" height="46"/>
    </g>
    <rect x="705" y="257" width="40" height="46" fill="#4c3b21"/>
