<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="千禧年槐安里居民合影">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8c0a8"/>
      <stop offset=".55" stop-color="#afa78e"/>
      <stop offset="1" stop-color="#88836f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8571"/>
      <stop offset="1" stop-color="#5c574b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b09a"/>
      <stop offset="1" stop-color="#8e8775"/>
    </linearGradient>
    <radialGradient id="leak" cx=".18" cy=".2" r=".65">
      <stop offset="0" stop-color="#ffe8b0" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffe8b0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffe8b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".48" r=".72">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#100d08" stop-opacity=".62"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#leak)"/>

  <!-- 居民楼 -->
  <g opacity=".9">
    <rect x="410" y="48" width="390" height="360" fill="url(#wall)"/>
    <rect x="410" y="48" width="390" height="12" fill="#6e6858"/>
    <g fill="#6c685a" stroke="#595547" stroke-width="1">
      <rect x="436" y="82" width="45" height="42"/><rect x="496" y="82" width="45" height="42"/>
      <rect x="556" y="82" width="45" height="42"/><rect x="616" y="82" width="45" height="42"/>
      <rect x="676" y="82" width="45" height="42"/><rect x="736" y="82" width="45" height="42"/>
      <rect x="436" y="148" width="45" height="42"/><rect x="496" y="148" width="45" height="42"/>
      <rect x="556" y="148" width="45" height="42" fill="#4a4740"/><rect x="616" y="148" width="45" height="42"/>
      <rect x="676" y="148" width="45" height="42"/><rect x="736" y="148" width="45" height="42"/>
      <rect x="436" y="214" width="45" height="42"/><rect x="496" y="214" width="45" height="42"/>
      <rect x="556" y="214" width="45" height="42"/><rect x="616" y="214" width="45" height="42"/>
      <rect x="676" y="214" width="45" height="42"/><rect x="736" y="214" width="45" height="42"/>
      <rect x="436" y="280" width="45" height="42"/><rect x="496" y="280" width="45" height="42"/>
      <rect x="556" y="280" width="45" height="42"/><rect x="616" y="280" width="45" height="42"/>
      <rect x="676" y="280" width="45" height="42"/><rect x="736" y="280" width="45" height="42"/>
    </g>
    <g fill="#5d5a4d" opacity=".7">
      <rect x="430" y="345" width="350" height="9"/>
      <rect x="430" y="382" width="350" height="7"/>
    </g>
    <text x="752" y="430" font-family="SimSun, serif" font-size="15" fill="#4e4a3d" opacity=".8" text-anchor="end">7号楼</text>
  </g>

  <!-- 地面 -->
  <rect x="0" y="410" width="800" height="190" fill="url(#ground)"/>
  <path d="M0 430 L800 416" stroke="#6e6858" stroke-width="2" opacity=".5"/>
  <path d="M0 492 L800 476 M0 552 L800 540" stroke="#6e6858" stroke-width="1" opacity=".35"/>

  <!-- 横幅 -->
  <g>
    <rect x="110" y="45" width="470" height="53" fill="#6e1818" opacity=".93"/>
    <rect x="116" y="51" width="458" height="41" fill="none" stroke="#d5b779" stroke-width="1"/>
    <text x="345" y="79" text-anchor="middle" font-family="SimSun, serif" font-size="22" fill="#ead7a8" letter-spacing="6">槐安里 · 千禧百家福</text>
  </g>

  <!-- 人群：三排 -->
  <g stroke="#3f3b32" stroke-width="1">
    <!-- 后排 -->
    <g fill="#4f4c42">
      <circle cx="100" cy="300" r="17"/><path d="M80 322 Q100 306 120 322 L128 404 L72 404 Z"/>
      <circle cx="155" cy="292" r="16"/><path d="M136 313 Q155 299 174 313 L181 401 L129 401 Z"/>
      <circle cx="211" cy="302" r="17"/><path d="M191 324 Q211 308 231 324 L239 404 L183 404 Z"/>
      <circle cx="267" cy="294" r="16"/><path d="M248 315 Q267 301 286 315 L293 401 L241 401 Z"/>
      <circle cx="322" cy="303" r="17"/><path d="M302 325 Q322 309 342 325 L349 404 L295 404 Z"/>
      <circle cx="379" cy="296" r="16"/><path d="M360 317 Q379 303 398 317 L405 401 L353 401 Z"/>
      <circle cx="435" cy="304" r="17"/><path d="M415 326 Q435 310 455 326 L463 404 L407 404 Z"/>
      <circle cx="492" cy="294" r="16"/><path d="M473 315 Q492 301 511 315 L519 401 L466 401 Z"/>
      <circle cx="549" cy="302" r="17"/><path d="M529 324 Q549 308 569 324 L577 404 L521 404 Z"/>
      <circle cx="607" cy="294" r="16"/><path d="M588 315 Q607 301 626 315 L634 401 L581 401 Z"/>
      <circle cx="664" cy="303" r="17"/><path d="M644 325 Q664 309 684 325 L692 404 L636 404 Z"/>
      <circle cx="721" cy="296" r="16"/><path d="M702 317 Q721 303 740 317 L748 401 L695 401 Z"/>
    </g>
    <!-- 中排 -->
    <g fill="#605c50">
      <circle cx="74" cy="352" r="16"/><path d="M54 373 Q74 358 94 373 L102 444 L46 444 Z"/>
      <circle cx="130" cy="346" r="15"/><path d="M111 366 Q130 352 149 366 L156 443 L105 443 Z"/>
      <circle cx="185" cy="355" r="16"/><path d="M165 376 Q185 361 205 376 L213 444 L157 444 Z"/>
      <circle cx="242" cy="348" r="15"/><path d="M223 368 Q242 354 261 368 L268 443 L217 443 Z"/>
      <circle cx="298" cy="356" r="16"/><path d="M278 377 Q298 362 318 377 L326 444 L270 444 Z"/>
      <circle cx="354" cy="349" r="15"/><path d="M335 369 Q354 355 373 369 L380 443 L329 443 Z"/>
      <circle cx="411" cy="356" r="16"/><path d="M391 377 Q411 362 431 377 L439 444 L383 444 Z"/>
      <circle cx="467" cy="348" r="15"/><path d="M448 368 Q467 354 486 368 L493 443 L442 443 Z"/>
      <circle cx="523" cy="357" r="16"/><path d="M503 378 Q523 363 543 378 L551 444 L495 444 Z"/>
      <circle cx="580" cy="350" r="15"/><path d="M561 370 Q580 356 599 370 L606 443 L555 443 Z"/>
      <circle cx="637" cy="357" r="16"/><path d="M617 378 Q637 363 657 378 L665 444 L609 444 Z"/>
      <circle cx="694" cy="349" r="15"/><path d="M675 369 Q694 355 713 369 L720 443 L669 443 Z"/>
    </g>
    <!-- 前排儿童 -->
    <g fill="#746e5e">
      <circle cx="104" cy="421" r="13"/><path d="M88 438 Q104 427 120 438 L125 481 L83 481 Z"/>
      <circle cx="158" cy="416" r="12"/><path d="M143 432 Q158 422 173 432 L178 481 L138 481 Z"/>
      <circle cx="214" cy="423" r="13"/><path d="M198 440 Q214 429 230 440 L235 481 L193 481 Z"/>
      <circle cx="270" cy="417" r="12"/><path d="M255 433 Q270 423 285 433 L290 481 L250 481 Z"/>
      <circle cx="327" cy="424" r="13"/><path d="M311 441 Q327 430 343 441 L348 481 L306 481 Z"/>
      <circle cx="384" cy="417" r="12"/><path d="M369 433 Q384 423 399 433 L404 481 L364 481 Z"/>
      <circle cx="441" cy="423" r="13"/><path d="M425 440 Q441 429 457 440 L462 481 L420 481 Z"/>
      <circle cx="498" cy="416" r="12"/><path d="M483 432 Q498 422 513 432 L518 481 L478 481 Z"/>
      <circle cx="555" cy="424" r="13"/><path d="M539 441 Q555 430 571 441 L576 481 L534 481 Z"/>
      <circle cx="612" cy="418" r="12"/><path d="M597 434 Q612 424 627 434 L632 481 L592 481 Z"/>
    </g>
  </g>

  <!-- 最后一排右边，多出来的那个人 -->
  <g>
    <ellipse cx="681" cy="484" rx="23" ry="5" fill="#3b382e" opacity=".28"/>
    <path d="M660 444 Q680 426 700 444 L704 481 L656 481 Z" fill="#d9d3bd"/>
    <path d="M660 444 Q680 432 700 444 L697 463 Q680 452 663 463 Z" fill="#e7e1cb"/>
    <circle cx="680" cy="410" r="14" fill="#3b3930"/>
    <path d="M666 410 Q666 394 680 392 Q694 394 694 410 L692 420 Q680 412 668 420 Z" fill="#23221c"/>
    <path d="M668 423 Q674 428 680 428 Q686 428 692 423 L692 433 Q680 440 668 433 Z" fill="#c8bca5"/>
    <path d="M672 447 Q680 452 688 447 L688 481 L672 481 Z" fill="#eee8d4" opacity=".8"/>
    <path d="M660 446 Q649 460 651 474 L657 478 Q657 460 668 451 Z" fill="#cfc9b4"/>
    <path d="M700 446 Q711 460 709 474 L703 478 Q703 460 692 451 Z" fill="#cfc9b4"/>
    <path d="M697 470 L709 475 L706 487 L694 481 Z" fill="#8f2924" opacity=".95"/>
    <path d="M674 481 L673 490 L680 490 L680 481 Z" fill="#6d2b27"/>
    <path d="M682 481 L683 490 L690 490 L688 481 Z" fill="#6d2b27"/>
  </g>

  <!-- 远处廊下的小小身影 -->
  <g opacity=".5" filter="url(#blur1)">
    <circle cx="769" cy="382" r="6" fill="#d8d3bf"/>
    <path d="M761 392 Q769 386 777 392 L780 427 L758 427 Z" fill="#d8d3bf"/>
  </g>

  <!-- 划痕与漏光 -->
  <g stroke="#f2e8cd" opacity=".32">
    <path d="M58 92 L73 208" stroke-width="1"/>
    <path d="M694 78 L687 174" stroke-width="1"/>
    <path d="M107 372 L152 390" stroke-width=".8"/>
    <path d="M606 456 L664 468" stroke-width=".8"/>
  </g>
  <g stroke="#2e2a22" opacity=".35">
    <path d="M34 512 L92 498" stroke-width="1"/>
    <path d="M734 86 L770 93" stroke-width="1"/>
  </g>

  <rect width="800" height="600" filter="url(#noise)" opacity=".28" style="mix-blend-mode:multiply"/>
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- 时间戳 -->
  <g opacity=".68">
    <text x="760" y="556" text-anchor="end" font-family="Courier New, monospace" font-size="15" fill="#f5dca0">'99 12 31</text>
    <text x="760" y="574" text-anchor="end" font-family="SimSun, serif" font-size="10" fill="#f5dca0" letter-spacing="2">槐安里居委会 留影</text>
  </g>
</svg>
